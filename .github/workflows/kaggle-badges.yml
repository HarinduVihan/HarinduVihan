name: Kaggle Badges

on:
  push:
    branches:
      - main
  schedule:
    # 11:11 UTC every day
    - cron: "11 11 * * *"
  workflow_dispatch:

concurrency:
  group: kaggle-badges
  cancel-in-progress: true

jobs:
  create-badges:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome@131.0.6778.85

      - name: Generate Kaggle badges
        uses: takayoshi-makabe/kaggle-badges@v1.4.0
        with:
          user_name: harinduvihan

      - name: Commit and push generated SVG files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Kaggle badges [skip ci]"
            git push
          fi
